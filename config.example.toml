# Mycelium configuration — copy this file to ~/.mycelium/config.toml
# (or $XDG_CONFIG_HOME/mycelium/config.toml) and edit as needed.
#
# Resolution order: CLI args > env vars > this file > built-in defaults.
# Env var pattern: MYCELIUM_<SECTION>_<KEY>  (e.g. MYCELIUM_SERVER_PORT=9000)
# All paths support ~ expansion.

[server]
host = "127.0.0.1"
port = 8200
transport = "stdio"        # "stdio" | "http"
log_level = "info"         # "debug" | "info" | "warning" | "error"

[storage]
db_path = "~/.mycelium/memory.db"
backup_dir = "~/.mycelium/backups"

[memory]
# Semantic-card behavior. Defaults are sensible for a single-user install.
decay_tau_days = 30.0          # exponential decay time constant for connections
prune_threshold = 0.05         # connections weaker than this get pruned
auto_connect_limit = 5         # max auto-connections created on save
hub_limit = 15                 # max hub memories returned by context()
recall_propagate = 8           # max neighbors to propagate per recall hit
consolidation_threshold = 10   # nudge to consolidate above this hot-memory count per project
pinned_decay_floor = 0.5       # pinned memories' connections never decay below this

# Recency surfacing (recent() tool + GET /wake) — the episodic view context() is
# blind to. recent() ranks by max(created, last_accessed), newest first.
recent_window_days = 14        # episodic horizon for recent() / /wake
recent_limit = 15              # max memories in a digest (mirrors hub_limit)
recent_summary_chars = 140     # per-line content trim in the recent() text digest
wake_summary_chars = 200       # per-item content trim in the /wake JSON payload
# Prior-override salience: a memory saved with contradicts_prior=True gets this
# ranking bump so a stored fact outranks the model's (possibly stale) training
# prior. Kept > pinned's implicit weight so a learned exception wins.
contradicts_prior_boost = 0.25

# Optional: keyword clusters for the discover() pass.
# Memories sharing any of these keywords get auto-linked. Add your own
# domain terms (vendor names, project codenames, etc.) — leave empty to skip
# the keyword-cluster pass.
keyword_clusters = []
# Example:
# keyword_clusters = ["acme corp", "northwind", "contoso"]

[foundry]
# Behavioral memory — append-only decision log.
enabled = true
log_dir = "~/.mycelium/foundry/logs"   # JSONL files; publisher writes here, ingest drains
db_path = "~/.mycelium/foundry.db"     # separate SQLite from semantic memory
ingest_interval_seconds = 0            # 0 = manual; >0 = run drain loop in background

[foundry.retention]
# Optional cleanup. Set to 0 to disable.
max_rows = 0           # 0 = unlimited
max_age_days = 0       # 0 = no age limit

[semantic]
# OPTIONAL semantic recall. Off by default — mycelium's core is pure SQLite+FTS5
# with no extra dependency. Set embed_url to ANY OpenAI-compatible /v1/embeddings
# endpoint to enable hybrid (keyword + meaning) recall. When unset, recall behaves
# exactly as before and no embedding calls are made.
#
# Local options (recommended): Ollama -> "http://localhost:11434/v1/embeddings"
#   (`ollama pull nomic-embed-text`), LM Studio, or llama.cpp --embedding.
# After enabling, backfill existing memories once:  mycelium backfill-vectors
embed_url = ""                         # e.g. "http://localhost:11434/v1/embeddings"
embed_model = "nomic-embed-text"       # nomic-embed-text | embeddinggemma | bge-* | text-embedding-3-small ...
weight = 10.0                          # how strongly cosine similarity drives ranking
top_k = 15                             # semantic candidates merged into the recall pool
chunk_chars = 1400                     # long memories are chunked + mean-pooled under this
timeout_seconds = 5                    # per embed call; keeps recall/save responsive
